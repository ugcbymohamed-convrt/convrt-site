<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0b" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <!-- Inter is self-hosted (see @font-face in src/index.css). Preload the Latin subset so text
         paints in the final font without waiting for the CSS to be parsed. -->
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Homepage hero + case-study videos stream from Cloudflare Stream: open the connection early. -->
    <link rel="preconnect" href="https://videodelivery.net" crossorigin />
    <!-- Homepage only: the hero video's poster is its largest paint. It is otherwise requested only after the
         JS bundle has rendered the <video>, which put it ~3 s out on slow 4G. Start it during HTML parsing,
         at high priority. Must stay identical to the poster URL in src/components/Hero.jsx so it is reused,
         not fetched twice. (Tested on the live site: LCP 3.03 s -> 1.43 s, slow 4G + 4x CPU.) -->
    <script>
      if (location.pathname === '/') {
        var l = document.createElement('link')
        l.rel = 'preload'
        l.as = 'image'
        l.fetchPriority = 'high'
        l.href = 'https://videodelivery.net/20c642c760e1937953fc33e98f3d859f/thumbnails/thumbnail.jpg?time=0s&height=600'
        document.head.appendChild(l)
      }
    </script>
    <title>Performance Creative Studio for Paid Social | CONVRT</title>
    <meta
      name="description"
      content="CONVRT creates performance-driven UGC, spokesperson ads and creator-led videos for apps, SaaS and e-commerce brands in English, Spanish, French and Arabic."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CONVRT" />
    <meta name="twitter:card" content="summary" />
    <meta property="og:title" content="CONVRT — Performance creatives that convert." />
    <meta
      property="og:description"
      content="UGC ads, spokesperson videos, organic social content, and creative strategy — built to stop the scroll and drive action."
    />
  </head>
  <body class="bg-canvas">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
